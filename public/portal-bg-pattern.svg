<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="blob1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00675c" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#00675c" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00675c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b31b25" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#b31b25" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#b31b25" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5bf4de" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#5bf4de" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#5bf4de" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fabc48" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#fabc48" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#fabc48" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#00675c" fill-opacity="0.16"/>
    </pattern>
  </defs>

  <!-- Sutil capa de dots de fondo -->
  <rect width="1600" height="1000" fill="url(#dots)"/>

  <!-- Blobs orgánicos -->
  <ellipse cx="200" cy="180" rx="380" ry="320" fill="url(#blob1)"/>
  <ellipse cx="1400" cy="260" rx="420" ry="340" fill="url(#blob3)"/>
  <ellipse cx="1300" cy="820" rx="360" ry="300" fill="url(#blob2)"/>
  <ellipse cx="380" cy="780" rx="320" ry="260" fill="url(#blob4)"/>
  <ellipse cx="820" cy="500" rx="280" ry="220" fill="url(#blob1)" opacity="0.5"/>

  <!-- Líneas curvas decorativas (muy sutiles) -->
  <g fill="none" stroke="#00675c" stroke-opacity="0.10" stroke-width="1.5">
    <path d="M0,400 Q400,200 800,420 T1600,380" />
    <path d="M0,620 Q400,440 800,640 T1600,600" />
  </g>

  <!-- Círculos de acento pequeños -->
  <g fill="#00675c" fill-opacity="0.14">
    <circle cx="100" cy="500" r="6"/>
    <circle cx="1500" cy="600" r="8"/>
    <circle cx="900" cy="120" r="5"/>
    <circle cx="700" cy="880" r="7"/>
    <circle cx="1200" cy="500" r="4"/>
  </g>
  <g fill="#b31b25" fill-opacity="0.13">
    <circle cx="1100" cy="200" r="6"/>
    <circle cx="400" cy="380" r="5"/>
    <circle cx="1450" cy="900" r="7"/>
  </g>
</svg>
